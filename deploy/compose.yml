# IngenMind, installed: everything runs on this machine from the published
# image. install.sh downloads this file into ~/.ingenmind with a .env beside it.
# Development uses docker-compose.yml in a clone instead.
name: ingenmind

x-app-env: &app-env
  PGHOST: pgvector
  PGPORT: "5432"
  PGUSER: rag
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGDATABASE: rag
  URLS_CONFIG_PATH: /data/urls.json
  # Embeddings run in-process; the model (130 MB) downloads on first start.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-}
  FASTEMBED_CACHE_PATH: /models
  # Chat model: anthropic (tested), openai (set LLM_MODEL too) or ollama.
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  AGENT_RUNTIME: local
  # Optional: the research agent's web search.
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  WEB_PUBLIC_URL: http://localhost:${INGENMIND_PORT:-18000}
  # Development sign-in: localhost only, the first visitor becomes the admin.
  AUTH_MODE: dev
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}

x-app: &app
  image: ${INGENMIND_IMAGE:-ghcr.io/cherrydasika/ingenmind}:${INGENMIND_VERSION:?Set INGENMIND_VERSION in .env}
  restart: unless-stopped
  depends_on:
    pgvector:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rag
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    environment:
      <<: *app-env
      PYTHONPATH: /app/dags
    volumes:
      - models:/models
    command: python -m ingestion_worker
    stop_grace_period: 60s

  webapp:
    <<: *app
    environment: *app-env
    volumes:
      - models:/models
    ports:
      - "127.0.0.1:${INGENMIND_PORT:-18000}:8000"

  # The fictional demo documents, loaded at each start (safe to repeat), while
  # .env has COMPOSE_PROFILES=demo. Empty it before setting up your own domain.
  seed:
    <<: *app
    profiles: [demo]
    restart: "no"
    environment:
      <<: *app-env
      PYTHONPATH: /app/dags
    volumes:
      - models:/models
    command: python -m seed_demo

volumes:
  pgvector_data:
  models:
