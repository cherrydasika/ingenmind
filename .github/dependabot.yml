# Weekly update pull requests; security updates arrive as soon as they're
# published. Each runs the same required checks as any other pull request.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    # Only when the range doesn't allow the new version (not to raise minimums).
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web/flows-app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      flow-builder:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
