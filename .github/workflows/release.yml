name: Release

# A version tag (v1.0.0, or v1.0.0-rc.1 for a pre-release) builds the image for
# amd64 and arm64, pushes it to GitHub Container Registry with an SBOM and
# build provenance, signs it with Sigstore (keyless: this workflow's identity),
# and publishes a GitHub Release with the files install.sh needs and notes
# generated from the merged PRs (grouped by .github/release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # the GitHub Release
  packages: write     # ghcr.io/<owner>/ingenmind
  id-token: write     # Sigstore keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ingenmind" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.image_tag }}
          provenance: mode=max
          sbom: true
          # A pre-release never moves "latest".
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.image_tag }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Release files
        run: |
          mkdir dist
          cp deploy/compose.yml dist/compose.yml
          cp install.sh dist/install.sh
          (cd dist && sha256sum compose.yml install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          gh release create "$TAG" dist/compose.yml dist/install.sh dist/SHA256SUMS --title "IngenMind $TAG" $flags
