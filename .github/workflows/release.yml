name: Release

# A version tag (v0.1.0, or v0.1.0-rc.1 for a pre-release) builds the image for
# amd64 and arm64, pushes it to GitHub Container Registry, and publishes a
# GitHub Release with the files install.sh needs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # the GitHub Release
  packages: write     # ghcr.io/<owner>/ingenmind

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ingenmind" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          # A pre-release never moves "latest".
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.image_tag }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release files
        run: |
          mkdir dist
          cp deploy/compose.yml dist/compose.yml
          cp install.sh dist/install.sh
          (cd dist && sha256sum compose.yml install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          gh release create "$TAG" dist/compose.yml dist/install.sh dist/SHA256SUMS --title "IngenMind $TAG" $flags
