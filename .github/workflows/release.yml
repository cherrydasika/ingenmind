name: Release

# A version tag (v1.0.0, or v1.0.0-rc.1 for a pre-release) builds the image for
# amd64 and arm64, pushes it to GitHub Container Registry with an SBOM and
# build provenance, signs it with Sigstore (keyless: this workflow's identity),
# and publishes a GitHub Release with the files install.sh needs and notes
# generated from the merged PRs (grouped by .github/release.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # the GitHub Release
  packages: write     # ghcr.io/<owner>/ingenmind
  id-token: write     # Sigstore keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: version
        run: |
          tag=${GITHUB_REF_NAME}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ingenmind" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.image_tag }}
          provenance: mode=max
          sbom: true
          # A pre-release never moves "latest".
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.image_tag }}
            ${{ steps.version.outputs.prerelease == 'false' && format('{0}:latest', steps.version.outputs.image) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Release files
        run: |
          mkdir dist
          cp deploy/compose.yml dist/compose.yml
          cp install.sh dist/install.sh
          (cd dist && sha256sum compose.yml install.sh > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags="--generate-notes --verify-tag"
          [ "$PRERELEASE" = true ] && flags="$flags --prerelease"
          gh release create "$TAG" dist/compose.yml dist/install.sh dist/SHA256SUMS --title "IngenMind $TAG" $flags
