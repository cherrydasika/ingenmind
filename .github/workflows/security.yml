name: Security checks

# Known vulnerabilities in the Python and npm dependencies and in the web
# image, secrets committed by mistake, and CodeQL's code scanning. Runs on
# every pull request (so it can be required), on main, and weekly, since new
# vulnerabilities are published against code that hasn't changed.
# Triaged packages, each with its reason: .github/security/allowed.txt.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install pip-audit
      # The versions a fresh install resolves, as the image and CI install them.
      - name: pip-audit
        run: |
          pip-audit --progress-spinner off -r requirements-web.txt --format json -o pip-audit.json || true
          python .github/security/check.py pip-audit pip-audit.json
      - name: npm audit (flow builder)
        run: npm ci --prefix web/flows-app && npm audit --prefix web/flows-app --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile.web -t ingenmind-web:scan .
      # Trivy from its pinned GHCR image (not the GitHub Action): fixable
      # high and critical findings fail the check.
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.1 \
            image --quiet --severity HIGH,CRITICAL --ignore-unfixed --format json ingenmind-web:scan > trivy.json
          python3 .github/security/check.py trivy trivy.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - web/static/flows
              - "**/node_modules"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
