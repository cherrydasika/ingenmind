name: Docs

# The docs site (R62), built from README.md by scripts/docs/build.py. Every
# PR that touches the docs builds it strictly (a broken link or an unplaced
# README section fails); a release tag (not a pre-release) or a manual run
# publishes it to GitHub Pages.
on:
  pull_request:
    paths: [README.md, CHANGELOG.md, "docs/**", mkdocs.yml, "scripts/docs/**", .github/workflows/docs.yml]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r scripts/docs/requirements.txt
      - run: python scripts/docs/build.py && mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
