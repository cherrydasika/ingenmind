name: Terraform and app checks

# Every pull request is checked, whatever it changes, so the checks can be
# required before merging. A push to main is checked only when it changes
# what is deployed; a passing check there publishes the commit
# (publish-source.yml).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "dags/**"
      - "web/**"
      - "requirements-web.txt"
      - "docker-compose*.yml"
      - "scripts/aws/**"
      - "infra/terraform/**"
      - ".github/workflows/terraform-*.yml"
      - ".github/workflows/publish-source.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform validate -no-color

  pgvector-tests:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: rag
      PGPASSWORD: test-password
      PGDATABASE: rag
      PYTHONPATH: app:dags
      WEB_DIR: web
      AWS_EC2_METADATA_DISABLED: "true"
      # Dependabot's pull requests don't get the repository's secrets.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Docker Hub refused GitHub's shared runners anonymous pulls
      # ("toomanyrequests") for hours at a time, so sign in when the secret is
      # there. PostgreSQL starts in a step rather than as a service container,
      # whose credentials can't be left out when the secret is missing.
      - name: Sign in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Start PostgreSQL with pgvector
        run: |
          docker run -d --name pgvector -p 5432:5432 -e POSTGRES_USER=rag -e POSTGRES_PASSWORD=test-password \
            -e POSTGRES_DB=rag pgvector/pgvector:pg17
          for i in $(seq 1 60); do docker exec pgvector pg_isready -h 127.0.0.1 -U rag -d rag && exit 0; sleep 2; done
          docker logs pgvector; exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: No merge-conflict markers
        run: "! git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!web/static/flows/*'"
      # As ES modules: a plain `node --check file.js` can miss syntax errors.
      - run: for file in web/static/js/*.js; do node --input-type=module --check < "$file" || exit 1; done
      # The flow canvas bundle is committed (the server has no Node): it must match its sources.
      - run: npm ci --prefix web/flows-app && npm run build --prefix web/flows-app
      - run: npm test --prefix web/flows-app
      - run: |
          git diff --exit-code -- web/static/flows || { echo "Rebuild web/static/flows: cd web/flows-app && npm run build" >&2; exit 1; }
      - run: pip install -r requirements-web.txt
      - run: python -m unittest -v app/test_agent_runtime.py app/test_demo.py app/test_llm.py app/test_embeddings.py app/test_pg_store.py app/test_evidence.py app/test_research.py app/test_answer_eval.py app/test_guardrails.py app/test_flows.py app/test_api_tools.py app/test_auth.py app/test_sessions.py app/test_agent_memory.py app/test_users.py app/test_setup.py app/test_search_eval.py app/test_chunking.py app/test_rerank.py app/test_citations.py app/test_conversation.py app/test_user_memory.py app/test_contracts.py app/test_durable.py

  private-compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-placeholder
      MINIO_ROOT_PASSWORD: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.3.1
      - run: docker compose version
      - run: for file in scripts/aws/*.sh; do bash -n "$file"; done
      - run: >-
          docker compose -f docker-compose.yml -f docker-compose.langfuse.yml
          -f docker-compose.aws.yml config --format json |
          jq -e '.services | map(.restart) | all(. == "unless-stopped")'
      - run: >-
          docker compose -f docker-compose.yml -f docker-compose.langfuse.yml
          -f docker-compose.aws.yml config --format json |
          jq -e '.services | [.pgvector,.clickhouse,.minio,.redis,.postgres]
          | map(.volumes[]) | all(.source | startswith("/srv/rag-systems/"))
          and (map(.bind.create_host_path) | all(. == false))'
      - run: >-
          docker compose -f docker-compose.yml -f docker-compose.langfuse.yml
          -f docker-compose.aws.yml config --format json |
          jq -e '.services | ([.webapp,."langfuse-web",.minio] | all(.ports[]?.host_ip == "127.0.0.1"))
          and ([.webapp,.worker,."langfuse-web",."langfuse-worker"]
          | all(.environment.AWS_ACCESS_KEY_ID == "" and .environment.AWS_SECRET_ACCESS_KEY == ""))'