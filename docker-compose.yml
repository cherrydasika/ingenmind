# The web app's environment (kept as an anchor so it's easy to reuse).
x-app-env: &app-env
  PGHOST: pgvector
  PGPORT: "5432"
  PGUSER: rag
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGDATABASE: rag
  URLS_CONFIG_PATH: /data/urls.json
  # Embeddings (dags/common/embedding): bedrock (default) | openai | ollama | local.
  # Changing the model over stored vectors needs: python -m reindex_embeddings
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bedrock}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-}
  FASTEMBED_CACHE_PATH: /models
  # Chat model (app/llm.py): bedrock (default) | anthropic | openai | ollama.
  LLM_PROVIDER: ${LLM_PROVIDER:-bedrock}
  LLM_MODEL: ${LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  BEDROCK_MODEL: ${BEDROCK_MODEL:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
  BEDROCK_REGION: ${BEDROCK_REGION:-eu-west-2}
  # Where the agents run (app/agent_runtime.py): local (the chat model above,
  # sessions in PostgreSQL) or agentcore (the harness in agentcore-kb/).
  # Unset: agentcore when AGENT_HARNESS_ARN is set, else local.
  AGENT_RUNTIME: ${AGENT_RUNTIME:-}
  AGENT_HARNESS_ARN: ${AGENT_HARNESS_ARN:-}
  # The research agent's web search; on AWS it is read from SSM instead.
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  # Optional: only takes effect if docker-compose.langfuse.yml is also up.
  # Reuses the same key pair Langfuse auto-provisions for itself.
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
  WEB_PUBLIC_URL: http://localhost:18000
  # Sign-in (app/auth.py): dev (pick a user; localhost only) or oidc (any
  # OpenID Connect provider). The app never stores passwords.
  AUTH_MODE: ${AUTH_MODE:-dev}
  SESSION_SECRET: ${SESSION_SECRET:-}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}

# One image for the web app, worker and demo seed: each can build it, so a
# fresh clone never tries to pull it from a registry.
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.web

services:
  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rag
    volumes:
      - rag_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: *app-build
    image: rag_systems-web
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *app-env
      PYTHONPATH: /app/dags
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - ./dags:/app/dags:ro
      - rag_models:/models
    command: python -m ingestion_worker
    # On SIGTERM the worker finishes and checkpoints the URL in progress.
    stop_grace_period: 60s

  # The UI: HTML/JS frontend (web/) + its JSON API (app/web_api.py).
  webapp:
    build: *app-build
    image: rag_systems-web
    restart: unless-stopped
    depends_on:
      pgvector:
        condition: service_healthy
    environment: *app-env
    # Lets the ollama providers reach an Ollama on the host (Linux needs this mapping).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - ./dags:/app/dags:ro
      - ./web:/web:ro
      # URL lists (urls.json, else urls.example.json), the demo documents and
      # historical evaluation artifacts (data/evaluations), read-only.
      - ./data:/data:ro
      - rag_models:/models
    ports:
      - "127.0.0.1:18000:8000"
    # No --reload: bind-mount file events are unreliable on macOS and a half-
    # synced change can crash the reloader. Restart the service after edits.
    command: uvicorn web_api:app --app-dir /app --host 0.0.0.0 --port 8000

  # COMPOSE_PROFILES=demo: load the fictional documents in data/demo once.
  seed:
    profiles: [demo]
    build: *app-build
    image: rag_systems-web
    restart: "no"
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      <<: *app-env
      PYTHONPATH: /app/dags
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - ./dags:/app/dags:ro
      - ./data/demo:/data/demo:ro
      - rag_models:/models
    command: python -m seed_demo

  # COMPOSE_PROFILES=ollama: a CPU Ollama in Docker, and a one-off pull of
  # the models in OLLAMA_PULL. Point the app at it with
  # OLLAMA_BASE_URL=http://ollama:11434/v1. A native Ollama on the host is
  # faster on a Mac (it uses the GPU); that is the default URL.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    volumes:
      - rag_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.35.1
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL: ${OLLAMA_PULL:-qwen2.5:14b}
    entrypoint: ["/bin/sh", "-c", "for model in $$OLLAMA_PULL; do ollama pull \"$$model\" || exit 1; done"]

volumes:
  rag_pgvector_data:
  # Models downloaded by EMBEDDING_PROVIDER=local, shared by the web app and worker.
  rag_models:
  rag_ollama:
